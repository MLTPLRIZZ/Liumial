<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liumial — demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="header">
    <h3 style="margin:0;flex:1">Liumial</h3>
    <div id="auth-ui">
      <button id="btn-google" class="button">Sign in with Google</button>
    </div>
  </div>
  <div style="display:flex;gap:16px;padding:16px">
    <div style="width:280px">
      <h4>Account</h4>
      <div id="account-box">
        <div id="logged-out">
          <input id="email" class="input" placeholder="email" style="width:100%;margin-bottom:8px" />
          <input id="password" type="password" class="input" placeholder="password" style="width:100%;margin-bottom:8px" />
          <button id="btn-login" class="button" style="width:100%">Log in</button>
          <button id="btn-register" class="button" style="width:100%;margin-top:8px">Register</button>
        </div>
        <div id="verify-box" style="display:none;margin-top:8px">
          <p>Enter the 6-digit verification code we sent to <span id="verify-email"></span>:</p>
          <input id="verify-code" class="input" placeholder="123456" style="width:100%;margin-bottom:8px" />
          <button id="btn-verify" class="button" style="width:100%">Verify</button>
        </div>
        <div id="logged-in" style="display:none">
          <div id="me"></div>
          <button id="btn-logout" class="button">Log out</button>
        </div>
      </div>
    </div>
    <div style="flex:1">
      <h4>Chat</h4>
      <div id="chat" class="chat"></div>
      <div>
        <input id="msg" class="input" placeholder="Type a message" style="width:70%" />
        <button id="btn-send" class="button">Send</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
