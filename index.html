<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liumial — Community Chat (Static)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loading overlay: uses SVG (preferred) with PNG fallback if needed -->
  <div id="loading-overlay" class="loading-overlay" aria-hidden="false">
    <picture>
      <source srcset="assets/loading.svg" type="image/svg+xml">
      <img src="assets/loading.svg" alt="Loading Liumial" id="loading-image" />
    </picture>
  </div>

  <div id="app" class="app-root" aria-hidden="true">
    <div class="servers-col" id="servers-col"></div>

    <aside class="sidebar">
      <div class="brand">Liumial Community</div>
      <div id="auth-area"></div>
      <div id="servers-list" class="list"></div>
      <button id="create-server-btn" class="btn">Create Server</button>
      <div class="divider"></div>
      <div class="profile-compact" id="profile-compact"></div>
    </aside>

    <main class="main-area">
      <header class="main-header">
        <div id="server-title">Welcome</div>
        <div class="header-actions">
          <button id="toggle-theme-btn" class="btn small">Theme</button>
          <button id="open-settings" class="btn small">Settings</button>
        </div>
      </header>

      <section class="content">
        <nav class="channels" id="channels-list"></nav>
        <section class="chat-area">
          <div id="messages" class="messages"></div>
          <form id="message-form" class="message-form">
            <input id="message-input" placeholder="Type a message... (use /help for bot)" autocomplete="off" />
            <button type="submit" class="btn">Send</button>
          </form>
        </section>
        <aside class="rightpanel">
          <div class="profile-panel" id="profile-panel"></div>
          <div class="quests" id="quests-panel"></div>
        </aside>
      </section>
    </main>
  </div>

  <!-- Modals and templates -->
  <div id="modal-root"></div>

  <!-- Supabase CDN (client) + server-sync + app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/bundle.min.js"></script>
  <script src="server-sync.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
