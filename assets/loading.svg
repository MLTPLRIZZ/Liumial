<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/loading.svg - stylized golden X loading image -->
<svg width="1024" height="640" viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#000" />
  <g transform="translate(512,320)">
    <!-- rounded square backdrop subtle stroke -->
    <rect x="-360" y="-240" width="720" height="480" rx="48" ry="48" fill="#050505" stroke="#111" stroke-width="6" opacity="0.7" />
    <!-- glowing golden X -->
    <g filter="url(#glow)">
      <path d="M-220,-180 L0,-30 L220,-180 L180,-220 L0,-70 L-180,-220 Z" fill="#ffd54a" />
      <path d="M-220,180 L0,30 L220,180 L180,220 L0,70 L-180,220 Z" fill="#ffd54a" />
      <path d="M-180,-220 L-30,0 L-180,220 L-220,180 L-70,0 L-220,-180 Z" fill="#ffd54a" />
      <path d="M180,-220 L30,0 L180,220 L220,180 L70,0 L220,-180 Z" fill="#ffd54a" />
    </g>
    <!-- center diamond to match the provided design -->
    <polygon points="0,-70 35,-35 0,0 -35,-35" fill="#fff59d" opacity="0.9" />
    <defs>
      <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="18" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </g>
</svg>
